# This project checking itself. A duplication checker that duplicates its own
# declarations would be evidence against itself.
#
# This file used to declare `python-constants` over three modules and found
# nothing for six commits -- not because the tree was clean, but because this
# codebase has no module-level *string* constants. Its canonical things are
# code shapes and non-string values, so `code-patterns` is the adapter that
# fits. Same diagnosis the tool reached on kento-core: a missing adapter, not a
# broken mechanism. `config.py` now refuses an empty registry so the next one
# announces itself instead of passing.
[project]
root = "."
exclude = ["tests/", "corpus/", ".venv/", "deliverables/"]

# Documentation is a registry of claims about this tree, so it gets checked
# like one. `historical` names records that cite what was true when written --
# an archive is not stale, it is an archive.
[claims]
suffixes = [".md"]
historical = ["archives/"]

[[registry]]
name = "canonical"
kind = "code-patterns"

  # The config filename has one declared home. Help text and error messages
  # that spell it out again go stale silently when it changes -- which it did,
  # twice, during the rename from registry.toml to traceface.toml to this.
  [[registry.entry]]
  id = "CONFIG_NAMES"
  antipatterns = ['kinemata\.toml']
  home = ["src/kinemata/config.py"]
  note = "the config filename -- interpolate, don't respell"

  # The projection budget. A second copy of the number is how a budget and the
  # check that enforces it drift apart.
  [[registry.entry]]
  id = "DEFAULT_BUDGET"
  antipatterns = ['\b16384\b', '16\s*\*\s*1024']
  home = ["src/kinemata/contract.py"]
  note = "16 KB projection ceiling"

  # The frequency-suppression threshold.
  [[registry.entry]]
  id = "DEFAULT_MAX_SITES"
  antipatterns = ['max_sites\s*=\s*20\b']
  home = ["src/kinemata/report.py"]
  note = "suppression threshold"

  # The walk skips these once, in one place. A second inline list is how a
  # scanner starts reading .venv in one code path and not another.
  [[registry.entry]]
  id = "SKIP_DIRS"
  antipatterns = ['__pycache__', 'node_modules']
  home = ["src/kinemata/bypass.py"]
  note = "directories never worth scanning"

  # The identifier-boundary class. Re-rolling it by hand is how two matchers
  # come to disagree about what counts as a word.
  [[registry.entry]]
  id = "_BOUNDARY"
  antipatterns = ['\[A-Za-z0-9_\.\\-\]']
  home = ["src/kinemata/contract.py"]
  note = "identifier boundary character class"

# Names this project has retired. A rename is only finished when nothing spells
# the old name, and "nothing" is a claim worth checking rather than asserting --
# `enumerate()` outlived the method it named by three commits.
#
# This is the same machinery as above pointed at prose, which is the whole
# argument: a list of forbidden spellings IS a registry, so it should be checked
# like one rather than kept in a checker's source as a hand-written table.
#
# `home` reads as "documents entitled to record this retirement" -- a changelog
# or a history section legitimately spells the dead name. Keep that list short.
# It fired on the README the moment it was added, and widening the allowlist to
# quiet prose is how a check stops checking.
[[registry]]
name = "retired"
kind = "code-patterns"
suffixes = [".md"]

  [[registry.entry]]
  id = "kinemata"
  antipatterns = ['\btraceface\b']
  home = ["docs/design.md"]
  note = "the working codename, retired 2026-09-05"

  [[registry.entry]]
  id = "entries()"
  antipatterns = ['\benumerate\(\)']
  home = ["docs/design.md"]
  note = "the contract's required method was renamed"
