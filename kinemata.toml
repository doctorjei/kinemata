# This project checking itself. A duplication checker that duplicates its own
# declarations would be evidence against itself.
#
# This file used to declare `python-constants` over three modules and found
# nothing for six commits -- not because the tree was clean, but because this
# codebase then had no module-level *string* constants. Its canonical things
# were code shapes and non-string values, so `code-patterns` is the adapter
# that fits. Same diagnosis the tool reached on kento-core: a missing adapter,
# not a broken mechanism. `config.py` now refuses an empty registry so the next
# one announces itself instead of passing.
#
# ⚑ Past tense as of 2026-09-11: the codebase has grown nine of them, and this
# comment asserted otherwise for as long as they existed. Measured rather than
# assumed -- a `python-constants` registry over the three modules that have
# them yields 13 entries, no strong findings and 4 weak signals, so it would be
# a real check that currently protects nothing. Not declared for that reason
# alone, and the sentence above is corrected rather than left to be trusted.
# `exclude` names two different things, and the second one is not a build tree.
# `tests/`, `corpus/`, `.venv/` and `deliverables/` are trees this project builds
# or vendors. `LICENSE.md` and `AIPOLICY.md` are text it **carries without
# authoring**, kept as received, and every check here judges a tree against what
# its author meant -- which for those two is somebody else.
#
# Measured 2026-09-11 rather than assumed. They yield no claims and no spelling
# findings, so nothing is lost. What they did yield was seven undated citations
# that can never be stamped, because stamping them means editing the GPL; and
# **all five addresses `[claims] external` fetched on every run**, none of which
# are this project's. A network check whose whole population is quoted text is
# checking nobody's links and goes red when the FSF reorganizes a page.
[project]
root = "."
exclude = [
    "tests/", "corpus/", ".venv/", "deliverables/",
    "LICENSE.md", "AIPOLICY.md",
]

# Documentation is a registry of claims about this tree, so it gets checked
# like one. `historical` names records that cite what was true when written --
# an archive is not stale, it is an archive.
#
# `.py` is deliberately absent, and this is the measurement rather than an
# oversight. Docstrings here are documentation -- the convention is that they
# name the incident or measurement that forced the design -- and nothing was
# reading them, which cost two dead references to a design document that had
# moved, in `contract.py` and `projection.py`, the two files a reader opens
# first. `claims` can read them now, and both were found by adding the suffix.
#
# Measured 2026-09-10 with the suffix added: 95 claims, 24 unresolved, and the
# two real ones are the whole yield. The rest are correct as written -- short
# hashes belonging to the corpus repositories this project validated against,
# paths naming another project's files, and prose teaching a shape. The evidence
# these docstrings cite is mostly outside this tree, so a checker of this tree
# cannot settle it.
#
# The largest class there was a gap rather than a property: text that *shows* a
# shape had no way to say so, because a markdown document marks an illustration
# with a fence and a docstring had no equivalent. The illustration role closed
# it. Re-measured 2026-09-11: 18 unresolved under `src/` become 10, the 8 that
# went are all illustrations, and the suffix now reaches `[[count]]` through the
# same reduction -- so the docstring explaining the test-count oracle, which
# recounts numbers this project's notes once claimed and cannot be reworded
# without deleting the record, is marked rather than tripping the oracle.
#
# Armed 2026-09-11, with a residue of zero and no exemptions at all -- which is
# the only reason it is on. The blocker was never the mechanism: it was ten
# citations of other people's repositories, real evidence that cannot resolve
# here because those trees are gitignored corpora absent from a clean clone.
#
# Nine are now declared in `docs/bibliography.toml` with a `foreign` field
# naming the repository that owns them, so the sentence keeps its readable
# target and the gate stops judging this tree for another's contents. The
# tenth was not evidence at all -- `workset.yaml` is a filename that project's
# code composes at run time, and no file of that name is in the repository
# being scanned, so declaring it as a path there would have put a false
# statement into declared data. It is marked as shown instead.
#
# A ratchet over `claims` was built first and is deliberately unused here. An
# accepted-set of zero is the stronger position: every exemption is a thing a
# later reader has to re-derive the reason for.
[claims]
suffixes = [".md", ".py"]
historical = ["archives/"]

# A URL is a claim about the world, and it was the one claim in these documents
# nothing could falsify: link checking skipped any target carrying a scheme, so
# a dead OpenFastTrace URL sat in this box's conventions until a person reading
# them noticed. Opt-in, because a documentation checker that reaches the network
# unasked is a surprise and an air-gapped CI would fail with nothing wrong.
#
# Only 404 and 410 fail. A timeout, a 5xx or the 403 a bot-hostile host returns
# is reported by name and never gates: a check that goes red on weather teaches
# its reader to skim a red gate.
external = true

# A value in prose, and the command that settles it. Opt-in, because settling
# it means running a command named in a config file -- a trust decision worth
# making deliberately. Declared here because the failure is real: this project's
# notes claimed 74 tests while the true number went 76, 88, 103.
# Every citation carries a stamp. Armed 2026-09-11, and the existing population
# goes into the ratchet rather than being stamped by hand -- which is the
# adoption path `provenance.py` describes, taken here for reasons that were
# measured rather than assumed.
#
# The tree carried 67 undated citations when this was turned on: 60 paths, 6
# web addresses and one link. **All six addresses, and the link, are inside
# LICENSE.md and AIPOLICY.md**, which this project keeps as received -- so every
# citation the staleness clock would ever read is in text nobody here may edit.
# There is no way to say "this document is quoted material" short of excluding
# it from every scan, which would cost the spelling and claims checks over it
# too; boarded rather than built around.
#
# That leaves 60 local paths, and a stamp on one buys nothing a run does not
# already provide: section 6 scopes the clock to kinds that leave the machine,
# because a path is settled locally every time. Hand-stamping them would be 60
# tokens of ceremony with no reader.
#
# So what arming buys here is the forward half: a citation added from now on
# must be dated. That is the half worth having, and it is the half the ratchet
# leaves live.
#
# Where a citation's date lives, which is two different answers for two
# different readers. A stamp records when a checker last confirmed a reference;
# that is apparatus, and apparatus belongs where developers read. In `README.md`
# and `docs/` it is a token a reader has to learn to ignore, in the documents
# this project uses to explain itself.
#
# `suffixes` was the first answer and dropped those documents from the policy.
# Not a suppression -- the citations there were not exempted findings, they were
# not findings, because the policy did not reach them -- but it bought the
# notation's absence by giving up the coverage.
#
# `resources` is the better answer and both are kept, because they are not the
# same offer: a project that wants a tree genuinely out of the policy's reach is
# making a legitimate declaration. Here the scope is widened back to documents
# and the four user-facing ones are declared in a list that carries their date.
# Measured before it was built: 32 citations in those four files, all `path`
# kind, so what this buys today is coverage rather than freshness -- it starts
# paying the day one of them cites something that leaves the machine.
[citations]
provenance = true
suffixes = [".py", ".md"]
resources = "docs/resources.toml"

[[count]]
label = "test count"
pattern = '\*\*(\d+) tests?\*\*|\b(\d+) tests? pass\b|\*\*Tests:\*\* (\d+) pass\b|\b(\d+) tests? collected\b'
command = ["{python}", "-m", "pytest", "--collect-only", "-q"]
extract = '(\d+) tests collected'

# The projection budget, against the one document that states it as a byte
# count. This is the in-tree case for settling values rather than only counts:
# the number is declared once in contract.py and restated in three documents,
# and until this declaration existed, raising the constant left every gate green
# while all three documents went stale. The registries cannot catch it -- they
# are negative, and report a *second* spelling rather than a disagreeing one.
#
# The oracle imports the constant deliberately. It is not a consumer
# re-deriving the value, it is the thing that checks the documents against it,
# and it lives in a config rather than in scanned source.
#
# "a 16 KB budget" in the other two documents is knowingly left unsettled: the
# comparison is exact and converts nothing, so that spelling would need its own
# entry with its own oracle. Accepted, because a normalization that is wrong
# does not fail -- it passes.
[[count]]
label = "projection budget"
pattern = 'projection budget `(\d+)` B'
command = ["{python}", "-c", "from kinemata.contract import DEFAULT_BUDGET; print(f'budget={DEFAULT_BUDGET}')"]
extract = 'budget=(\d+)'

# The checks that must run, and the workflow that must run them. Deleting a
# step from CI now fails this gate instead of quietly passing; the only way to
# make it pass again is to delete the declaration too, which is a visible edit.
#
# Declared because the alternative has failed here three times: a registry over
# the wrong adapter that scanned nothing for six commits, `doc-check`'s
# exclusions growing until it reported clean, and two numbers in prose that no
# oracle covered. Green and inert read identically from outside.
#
# A reminder, not a catch -- an agent can edit both files in one commit. Branch
# protection with these jobs as required status checks is what makes them real.
[[gate]]
command = "pytest -q"
note = "the suite itself"

[[gate]]
command = "kinemata check"
note = "the tool against its own source"

[[gate]]
command = "kinemata claims"
note = "documentation, and this inventory"

# The closed-world catch. Declared 2026-09-11, a day after it began gating here:
# the `sources` bibliography became the first registry in this tree that can
# recognize its own identifiers, and nothing wired the catch into CI. A catch
# that does not run where the agent cannot reach it is a reminder wearing a
# catch's clothes -- and this inventory exists precisely to notice that.
[[gate]]
command = "kinemata undeclared"
note = "a citation naming a key no entry declares"

[[gate]]
command = "ruff check"
note = "lint; the rule set is declared in pyproject.toml"

# Two findings from `kinemata unused`, reviewed 2026-09-09 and set aside. This
# is the second kind of promise -- not a file the project will produce, but a
# question somebody answered and dated so the answer expires rather than
# hardens into silence.
#
# Both are true for the question `unused` asks and correct as they stand. The
# check cannot tell "module-local by design" from "orphan", which is exactly
# why it emits a review list and never a cut list.

[[promise]]
what = "DEFAULT_BUDGET is named only inside contract.py, and that is correct: consumers read registry.budget rather than the constant"
until = "2027-03-01"
note = "reviewed against projection.py, which routes through the attribute"
by = "Jei"

[[promise]]
what = "SKIP_DIRS is named only inside bypass.py, and that is correct: every other tree walk routes through _walk and _tree"
until = "2027-03-01"
note = "context.measure globs independently and does not prune these; deliberate, since [context] include is an explicit declaration rather than an unbounded walk"
by = "Jei"

[[registry]]
name = "canonical"
kind = "code-patterns"

  # The config filename has one declared home. Help text and error messages
  # that spell it out again go stale silently when it changes -- which it did,
  # twice, during the rename from registry.toml to traceface.toml to this.
  [[registry.entry]]
  id = "CONFIG_NAMES"
  antipatterns = ['kinemata\.toml']
  home = ["src/kinemata/config.py"]
  note = "the config filename -- interpolate, don't respell"

  # The baseline filename, same failure as above and the same fix. A gate that
  # reads one filename while `--record` writes another is a gate with an
  # exemption list it never loads.
  [[registry.entry]]
  id = "BASELINE_NAME"
  antipatterns = ['\.kinemata-baseline\.json']
  home = ["src/kinemata/baseline.py"]
  note = "the baseline filename -- interpolate, don't respell"

  # The projection budget. A second copy of the number is how a budget and the
  # check that enforces it drift apart.
  [[registry.entry]]
  id = "DEFAULT_BUDGET"
  antipatterns = ['\b16384\b', '16\s*\*\s*1024']
  home = ["src/kinemata/contract.py"]
  note = "16 KB projection ceiling"

  # The frequency-suppression threshold.
  [[registry.entry]]
  id = "DEFAULT_MAX_SITES"
  antipatterns = ['max_sites\s*=\s*20\b']
  home = ["src/kinemata/report.py"]
  note = "suppression threshold"

  # The walk skips these once, in one place. A second inline list is how a
  # scanner starts reading .venv in one code path and not another.
  [[registry.entry]]
  id = "SKIP_DIRS"
  antipatterns = ['__pycache__', 'node_modules']
  home = ["src/kinemata/bypass.py"]
  note = "directories never worth scanning"

  # The identifier-boundary class. Re-rolling it by hand is how two matchers
  # come to disagree about what counts as a word.
  [[registry.entry]]
  id = "_BOUNDARY"
  antipatterns = ['\[A-Za-z0-9_\.\\-\]']
  home = ["src/kinemata/contract.py"]
  note = "identifier boundary character class"

# Names this project has retired. A rename is only finished when nothing spells
# the old name, and "nothing" is a claim worth checking rather than asserting --
# `enumerate()` outlived the method it named by three commits.
#
# This is the same machinery as above pointed at prose, which is the whole
# argument: a list of forbidden spellings IS a registry, so it should be checked
# like one rather than kept in a checker's source as a hand-written table.
#
# Matched as prose: inline code spans are exempt, so a changelog recording the
# rename can spell the dead name. Fenced blocks are NOT exempt -- this fired on
# a README example that declared the real retired name inside one, and the
# example was reworded rather than the exemption widened.
[[registry]]
name = "retired"
kind = "substitutions"
suffixes = [".md"]
case_sensitive = true   # identifiers; `Entries()` is a different thing

  [registry.words]
  traceface = "kinemata"          # the working codename, retired 2026-09-05
  "enumerate()" = "entries()"     # the contract's required method was renamed

# The project's spelling convention, as data. It lived as a table inside
# doc-check.py until that table was found to be missing two words that were
# sitting in live documents while the check reported clean.
[[registry]]
name = "spelling"
kind = "substitutions"
source = "docs/american-english.toml"
suffixes = [".md", ".py"]

# Where the sources this project cites actually live. A citation carries a stamp
# and a reference key; the key's entry carries the path or the address, so a
# source that moves is edited once here rather than at every mention.
#
# Closed as of 2026-09-10, and the reason it could not be before is the point.
# `docs/citations.md` illustrates the notation with a key nothing declares, so
# closing would have turned an example in a specification into a failing gate --
# and the illustration is inside a fenced block, which nothing was reading as
# display rather than use. `match_mode = "unfenced"` fixed that, so a key nothing
# declares is now a real catch instead of an advisory line nobody reads.
#
# `.py` added 2026-09-11, with the `[claims]` suffix and for the same reason.
# The default is documents alone, which was right while citations lived only in
# documents -- and stopped being right the moment nine of them were written into
# docstrings. Until this line existed the closed-world catch could not see them:
# a docstring citing a key no entry declares would have passed, and `cite
# --where` reported zero sites for keys that had nine. **A catch that does not
# read where the citations are is not a catch**, and the reverse index and the
# catch must describe the same tree or they will eventually disagree about one.
[[registry]]
name = "sources"
kind = "bibliography"
closed = true
suffixes = [".md", ".py"]
source = "docs/bibliography.toml"
