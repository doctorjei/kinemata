[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinemata"
version = "0.1.0.dev0"
description = "One declared place per fact; find the code that re-derives it."
requires-python = ">=3.11"          # tomllib
dependencies = []                    # core takes none, deliberately
license = "GPL-3.0-only"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]                 # only for kind = "yaml-mapping"
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
kinemata = "kinemata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# The kanibako branch carries an integration suite as well; without naming it
# here a bare `pytest` would collect only `tests/` and report green while the
# integration test never ran.
testpaths = ["tests", "integrations"]
