[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "registry"
version = "0.1.0.dev0"
description = "One declared place per fact; find the code that re-derives it."
requires-python = ">=3.11"          # tomllib
dependencies = []                    # core takes none, deliberately
license = "GPL-3.0-only"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]                 # only for kind = "yaml-mapping"
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
registry = "registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
