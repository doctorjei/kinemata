[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinemata"
version = "0.2.1.dev1"
description = "One declared place per fact; find the code that re-derives it."
readme = "README.md"                 # without this a built distribution ships no
                                     # long description at all: the PyPI page and
                                     # `pip show` would both be the one line above.
requires-python = ">=3.11"          # tomllib
dependencies = []                    # core takes none, deliberately
license = "GPL-3.0-only"
authors = [{ name = "Jei Blanchard", email = "jjb@eng.ufl.edu" }]

# Deliberately short. `Programming Language :: Python :: 3.11` and friends are
# **not** here: `requires-python` above already declares the floor, and a
# classifier list restating it is a second carrier for one fact -- which is the
# thing this package exists to report. Same reasoning as the absent
# `[tool.ruff] target-version` below.
classifiers = [
  # A claim about readiness, which is the one thing a reader needs from this
  # row, and it is deliberately NOT derived from the version. It read "matches
  # the version above" while every published version carried a pre-release
  # segment; 0.1.0 does not, and the maturity did not change on the day the
  # segment was dropped. The API may still move.
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/doctorjei/kinemata"
Repository = "https://github.com/doctorjei/kinemata"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]                 # only for kind = "yaml-mapping"
dev = ["pytest>=8", "PyYAML>=6", "ruff>=0.16,<0.17", "build>=1"]  # ruff bounded: see [tool.ruff.lint]

[project.scripts]
kinemata = "kinemata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# No `target-version`: `requires-python` above already declares it and ruff
# reads it from there. Two carriers for one fact is what this tool exists to
# find.
[tool.ruff]
line-length = 100                    # the tree's widest line is 99; a ceiling to drive down

[tool.ruff.lint]
# Declared explicitly rather than taking the default set, which changes between
# releases -- a rule set that shifts on upgrade is a check nobody chose. The
# version bound in the `dev` extra holds the same line from the other side.
#
# `E` is not optional here: the `# noqa: E402` directives in `__init__.py` are
# live only while it is selected, and ruff reports them as unused without it.
select = ["E", "W", "F", "I", "UP", "B", "RUF", "PLW1510"]
