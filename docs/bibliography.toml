# The sources this project cites, as declared data rather than a table inside a
# checker. A citation carries a stamp and a key; this file carries the volatile
# half -- which path, which address -- so that a source moving is one edit here
# instead of an edit at every mention.
#
# Data, and not a table in Python, for the reason the word list is data: a
# hand-maintained list inside a checker is maintained by whoever remembers, and
# nobody can see what it does or does not cover without reading the source.
#
# Numbers are chosen, not minted. Any unused number is valid, gaps are fine, and
# a number is never reused -- renumbering breaks every cross-reference already
# pointing into the sequence, which is the churn this scheme exists to prevent.
#
# Type codes: the reserved core is declared implicitly (Pa, Wb, Cm are
# interpreted; Dc, Sp, Ru, Is, Pr, Rp, Bk, Ar are standardized). Codes this
# project invents would go in a [types] table here, and an entry naming a code
# nothing declares is refused rather than passed over.

[[entry]]
key = "Pa0001"
target = "docs/structure.md"
note = "the method: what a registry is for, and how a project adopts one"

[[entry]]
key = "Pa0002"
target = "docs/citations.md"
note = "the citation stamp and the reference key, with what settled each choice"

[[entry]]
key = "Pa0003"
target = "docs/design.md"
note = "the registry contract"

# Evidence in other people's repositories.
#
# These are the citations that forced the `Px` and `Cx` codes. The docstrings in
# `src/` name the incident or the measurement that produced a design, and for a
# tool validated against other projects most of that evidence is in those
# projects -- real commits and real files, permanently unresolvable here because
# those trees are gitignored corpora and absent from a clean clone.
#
# Two shapes were rejected before this one. Leaving them as dead claims makes a
# gate that can never go green over text nobody should change. Dropping the
# readable target so no claim is extracted moves the evidence into this file and
# out of the sentence that depends on it, against section 5.6 -- and the point
# of a docstring citing an incident is that a reader meets the incident where
# the reasoning is.
#
# `Px` is `Pa` and `Cx` is `Cm`, differing in locality and in nothing else. The
# code says the artifact is somebody else's; `repository` says whose. Both are
# required together, and an entry declaring one without the other is refused --
# a code with no repository cannot be followed, and a repository beside a local
# code says one thing to a reader and another to every check.
#
# ⚑ These were `Cm`/`Pa` with a `foreign` field until 2026-09-11. That field
# silently re-read "path in this tree" as "path in the named tree", which is
# coherent, undeclared, and the exact second-meaning-for-one-spelling this
# project reports in other people's code. The keys were renumbered from 1 within
# their new types: numbers are chosen rather than minted, so any unused one is
# valid and there is nothing to preserve across a retyping.

