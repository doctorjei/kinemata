# Own gates: the tool's tests, and the tool run against itself.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Both ends of `requires-python`, because the floor was asserted for days and
    # never run: the box this was written on has one interpreter, and a 3.12-only
    # stdlib call parses fine at 3.11 and fails only when something executes it.
    # `tests/test_packaging.py` fails if the floor stops appearing here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # which end broke is the whole information
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # corpus validation reconstructs a past commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    # Unused imports and stale suppressions are cheap to commit and invisible in
    # review, which is where a mechanism earns its keep. Its own job, so a lint
    # failure never stops the suite from reporting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Installed through the dev extra so the version bound has one carrier.
      - run: pip install -e ".[dev]"
      - run: ruff check

  self-check:
    # Dogfooding is not decoration here: a duplication checker that duplicates
    # its own constants would be evidence against itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit claims cannot be settled on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # **The dev extra, because a declared oracle has to be runnable.** This
      # job installed the runtime alone until 2026-09-13, and `kinemata claims`
      # failed here on every run from the day the test-count oracle was added:
      # the oracle is `python -m pytest --collect-only`, pytest was not
      # installed, the command produced no value, and a value that cannot be
      # read is never a pass. Four days of a red gate for a missing test
      # dependency, in the job whose whole purpose is running the gates.
      - run: pip install -e ".[dev]"
      - run: kinemata check
      # Documentation is a registry of claims about this tree.
      - run: kinemata claims
      # The closed-world catch. It began gating here on 2026-09-10, when the
      # bibliography became the first registry in this tree that can recognize
      # its own identifiers -- and it was not added here for a day. A catch that
      # does not run where the agent cannot reach it is not a catch.
      - run: kinemata undeclared

  distribution:
    # **The artifact, built and installed the way somebody else would get it.**
    #
    # Nothing checked this until 2026-09-13. Building the sdist by hand that day
    # found the package shipping a test that could not pass where it was sent:
    # `test_the_floor_is_exercised_in_ci` reads `.github/workflows/checks.yml`,
    # which an sdist does not carry. The suite was green in the repository and
    # red the moment it left it, and no gate could tell.
    #
    # So this job leaves the repository deliberately. It installs from the built
    # wheel into a clean interpreter -- not `-e .`, which every other job uses
    # and which reads the source tree -- and it runs the sdist's own tests from
    # the unpacked sdist rather than from here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # The console script, from an installed wheel. A `pip install -e .` would
      # pass this while the wheel shipped nothing importable.
      - name: the wheel installs and the command runs
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/kinemata --help
          /tmp/wheelenv/bin/python -c "from kinemata import registry; import kinemata.cli"
      # The sdist has to be able to build and test itself, away from this tree.
      - name: the sdist is self-sufficient
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install "/tmp/sdist[dev]"
          cd /tmp/sdist && /tmp/sdistenv/bin/pytest -q
      # Declared contents, checked. `MANIFEST.in` exists so that what ships is a
      # declaration rather than a default; a declaration nothing verifies is the
      # thing this project reports in other people's repositories.
      - name: the sdist carries what MANIFEST.in declares and nothing else
        run: |
          tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' > /tmp/shipped.txt
          for want in README.md LICENSE.md CHANGELOG.md AIPOLICY.md pyproject.toml \
                      kinemata.toml docs/design.md docs/introduction.md \
                      examples/ci-github-actions.yml src/kinemata/cli.py; do
            grep -qx "$want" /tmp/shipped.txt || { echo "missing from sdist: $want"; exit 1; }
          done
          for never in corpus canon-files keyspace-manifest.yaml .github; do
            ! grep -q "^$never" /tmp/shipped.txt || { echo "must not ship: $never"; exit 1; }
          done

  commands:
    # **Every other command, run for the fact that it still runs.**
    #
    # The gates above check the tree. Nothing checked the commands that are not
    # gates, and three of them broke without anything noticing: `context` was
    # missing from the project's own command table, `undeclared` gated locally
    # for a day while nothing here ran it, and `confirm` refused outright --
    # exit 2, before examining a single citation -- for most of a day, on a
    # break already found and fixed in `unused` hours earlier.
    #
    # Every one was invisible to every other check, and the last was found only
    # by a person running the command by hand. A gate says *this check must
    # run*; nothing said *this command must still work*, and that is the claim
    # this job makes.
    #
    # Its own job rather than steps in `self-check`, so an advisory command
    # falling over never hides which gate was red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # `confirm` settles commit citations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      # Advisory: each exits 0 on any completed run, so a non-zero exit here is
      # the command being broken rather than the tree being dirty.
      - run: kinemata ids
      - run: kinemata review -v
      - run: kinemata clusters -v
      - run: kinemata unused
      - run: kinemata stale
      - run: kinemata cite
      - run: kinemata baseline
      # Dry run. `--write` is never reached here: the one writing command in the
      # package must not run unattended in the place its output would be
      # committed from.
      - run: kinemata confirm
      # Reads no config at all, which is the property worth pinning -- it has to
      # work inside somebody else's document.
      - run: kinemata stamp
      # **A refusal is a claim too, and this is the row that says so.** This
      # repository has never declared `[context]`, so the command refuses with
      # exit 2 by design. Asserting the code rather than tolerating it means
      # `[context]` appearing, or the refusal silently becoming something else,
      # fails here instead of passing unread.
      - name: context refuses, this repository having declared none
        run: |
          set +e
          kinemata context
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "kinemata context exited $status; expected 2." >&2
            echo "This repository declares no [context], so a refusal is the" >&2
            echo "claim being pinned. If [context] was just declared, this" >&2
            echo "step should now run it and expect 0." >&2
            exit 1
          fi
      # Run for a zero, not asserted at 2. This step pinned a refusal until
      # 2026-09-18, when `tree-version` gave this repository its first set the
      # code produces: the tree's declared version against what the index
      # already carries, so a commit sitting on a published version fails here
      # rather than in somebody's silently-skipped `pip install`.
      #
      # It reaches the network, like the `claims` step. A red here in the window
      # between an upload and the post-release `.dev` bump is CORRECT and says
      # exactly one thing: bump the version.
      - name: parity, the tree's version against the index
        run: kinemata parity

      # And the third refusal of the same shape. The declarations here are a
      # bibliography and two negative registries; a rule about the shape of a
      # citation entry would have one carrier and no reader, so nothing
      # declares `[[shape]]`.
      - name: shape refuses, this repository declaring no rule
        run: |
          set +e
          kinemata shape
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "kinemata shape exited $status; expected 2." >&2
            echo "This repository declares no [[shape]], so a refusal is the" >&2
            echo "claim being pinned. If one was just declared, this step" >&2
            echo "should now run it and expect 0." >&2
            exit 1
          fi

      # The fourth, and the reason is the sharpest of them: a probe calls the
      # project's own code, and here that code is the tool doing the calling.
      # The suite probes it directly and better, so nothing declares `[[probe]]`.
      - name: probe refuses, this repository declaring no corpus
        run: |
          set +e
          kinemata probe
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "kinemata probe exited $status; expected 2." >&2
            echo "This repository declares no [[probe]], so a refusal is the" >&2
            echo "claim being pinned. If one was just declared, this step" >&2
            echo "should now run it and expect 0." >&2
            exit 1
          fi
