# This project checking itself. A duplication checker that duplicates its own
# constants would be evidence against itself.
[project]
root = "."
exclude = ["tests/", "corpus/", ".venv/", "deliverables/"]

[[registry]]
name = "constants"
kind = "python-constants"
modules = ["src/registry/contract.py", "src/registry/report.py", "src/registry/prose.py"]
